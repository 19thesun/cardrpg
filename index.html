<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProceduralRPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <div id="grid"></div>

        <div id="world-layer">
            <canvas id="game"></canvas>
        </div>

        <div id="screen-layer">
            <canvas id="screen"></canvas>
        </div>

        <div id="message-log"></div>

        <div id="menu">

        <div id="menu-tabs">
            <button class="tab-button active" data-tab="use">
                Use
            </button>

            <button class="tab-button" data-tab="book">
                Book
            </button>

            <button class="tab-button" data-tab="options">
                Options
            </button>
        </div>


        <div id="menu-slot"></div>


        <div id="menu-content">

            <section class="menu-panel active" data-panel="use">
                <div id="target-card-text">
                </div>
                <button id="use-button">
                    Use
                </button>
            </section>


            <section class="menu-panel" data-panel="book">

                <div id="book-container">
                    <!-- Card slots will go here -->
                </div>

            </section>


            <section class="menu-panel" data-panel="options">

                <h2>Options</h2>

                <button id="export-save">
                    Export Save
                </button>

                <button id="import-save">
                    Import Save
                </button>
                <button id="clear-save-button">
                    Clear Save
                </button>
                <p id="credits">
                    this game was made by Owen!
                </p>
                <button id="kill-owen-button">
                    Kill Owen
                </button>
                <input
                    id="save-file"
                    type="file"
                    accept=".json"
                    hidden
                >

            </section>

        </div>

        </div>

    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
